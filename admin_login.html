<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f8;
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #777;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #4b4ded;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            background: #ffe5e5;
            color: red;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #4b4ded;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>🛠️ Admin Login</h1>

    <p class="subtitle">
        TIET AI College Assistant
    </p>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

    <form action="/admin-login" method="POST">

        <label>
            👤 Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter admin username"
            required
        >

        <label>
            🔐 Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter admin password"
            required
        >

        <button type="submit">
            🔑 Admin Login
        </button>

    </form>

    <div class="back">

        <a href="/login">
            ← Student Login
        </a>

    </div>

</div>

</body>

</html>
