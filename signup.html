<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Signup</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #4b4ded,
                #7b2ff7
            );
        }

        .signup-box {
            width: 400px;
            max-width: 90%;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;

            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 2px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #4b4ded;
        }

        button {
            width: 100%;

            padding: 14px;

            margin-top: 25px;

            border: none;

            border-radius: 10px;

            background: #4b4ded;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #3839c9;
        }

        .error {
            background: #ffe5e5;

            color: #d00000;

            padding: 10px;

            border-radius: 8px;

            text-align: center;

            margin-bottom: 15px;
        }

        .login-link {
            text-align: center;

            margin-top: 20px;

            color: #666;
        }

        .login-link a {
            color: #4b4ded;

            text-decoration: none;

            font-weight: bold;
        }

        .back {
            text-align: center;

            margin-top: 15px;
        }

        .back a {
            color: #777;

            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="signup-box">

    <h1>🎓 Student Signup</h1>

    <p class="subtitle">
        Tagore Institute of Engineering and Technology
    </p>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST"
          action="/signup">

        <label for="name">
            👤 Full Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >


        <label for="email">
            📧 Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label for="password">
            🔒 Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            Create Account
        </button>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="/login">
            Login
        </a>

    </div>


    <div class="back">

        <a href="/">
            ← Back to Chatbot
        </a>

    </div>

</div>

</body>

</html>
