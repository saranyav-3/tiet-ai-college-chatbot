<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TIET Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-container {
            width: 420px;
            max-width: 92%;
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            font-size: 45px;
        }

        h1 {
            text-align: center;
            margin: 10px 0 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .role-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .role-button {
            flex: 1;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .role-button.active {
            background: #4b4ded;
            color: white;
            border-color: #4b4ded;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4b4ded;
        }

        .login-button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4b4ded;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .error {
            background: #ffe5e5;
            color: #c00;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
        }

        .signup a {
            color: #4b4ded;
            text-decoration: none;
            font-weight: bold;
        }

        #adminUsername {
            display: none;
        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="logo">
        🤖
    </div>


    <h1>
        TIET AI Assistant
    </h1>


    <p class="subtitle">
        Tagore Institute of Engineering and Technology
    </p>


    <!-- ROLE SELECTION -->

    <div class="role-buttons">

        <button
            type="button"
            id="studentButton"
            class="role-button active"
            onclick="selectStudent()">

            👩‍🎓 Student

        </button>


        <button
            type="button"
            id="adminButton"
            class="role-button"
            onclick="selectAdmin()">

            🛠️ Admin

        </button>

    </div>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <!-- LOGIN FORM -->

    <form id="loginForm"
          action="/login"
          method="POST">


        <!-- STUDENT EMAIL -->

        <div id="studentEmail">

            <label>
                📧 Student Email
            </label>

            <input
                type="email"
                name="email"
                id="emailInput"
                placeholder="Enter student email"
            >

        </div>


        <!-- ADMIN USERNAME -->

        <div id="adminUsername">

            <label>
                👤 Admin Username
            </label>

            <input
                type="text"
                name="username"
                id="usernameInput"
                placeholder="Enter admin username"
                disabled
            >

        </div>


        <!-- PASSWORD -->

        <label>
            🔐 Password
        </label>

        <input
            type="password"
            name="password"
            id="passwordInput"
            placeholder="Enter password"
            required
        >


        <button
            type="submit"
            class="login-button"
            id="loginButton">

            🔑 Student Login

        </button>


    </form>


    <!-- SIGNUP -->

    <div
        class="signup"
        id="signupSection">

        Don't have a student account?

        <br>

        <a href="/signup">
            Create Student Account
        </a>

    </div>


</div>


<script>

function selectStudent() {

    document.getElementById("studentButton")
        .classList.add("active");

    document.getElementById("adminButton")
        .classList.remove("active");


    document.getElementById("studentEmail")
        .style.display = "block";

    document.getElementById("adminUsername")
        .style.display = "none";


    document.getElementById("emailInput")
        .disabled = false;

    document.getElementById("usernameInput")
        .disabled = true;


    document.getElementById("loginForm")
        .action = "/login";


    document.getElementById("loginButton")
        .textContent = "🔑 Student Login";


    document.getElementById("signupSection")
        .style.display = "block";

}


function selectAdmin() {

    document.getElementById("adminButton")
        .classList.add("active");

    document.getElementById("studentButton")
        .classList.remove("active");


    document.getElementById("studentEmail")
        .style.display = "none";

    document.getElementById("adminUsername")
        .style.display = "block";


    document.getElementById("emailInput")
        .disabled = true;

    document.getElementById("usernameInput")
        .disabled = false;


    document.getElementById("loginForm")
        .action = "/admin-login";


    document.getElementById("loginButton")
        .textContent = "🛠️ Admin Login";


    document.getElementById("signupSection")
        .style.display = "none";

}

</script>


</body>

</html>
